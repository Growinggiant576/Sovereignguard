 shown, and there is no data sharing agreement. The partner also planned to process the data on a cloud server outside the UAE. Federal law blocks this unless a health authority decree allows it, and none is shown. Dubai (DHA) rules do not yet cover this offshore step in the material reviewed. Nothing has been released.", "what_you_need_to_do": ["Nothing is required. Your data stays put unless the missing conditions are met.", "If anyone asks you to agree to research or AI training, you may say yes or no. Your current consent does not cover it.", "Ask the hospital how it would prove your data is truly anonymous and whether ethics approval exists."], "what_happens_next": "Sharing can go ahead only if the hospital provides the missing proof. Offshore processing stays blocked unless a decree is issued. A human reviewer will check these results.", "disclaimer": "This is a research prototype, not legal or medical advice."}, "steps": [{"id": "1", "title": "Dubai hospital shares de-identified record with an AI research partner", "from": "Receiving hospital (DHA-licensed, Dubai)", "to": "AI research partner (Dubai)", "purpose": "research ai training", "outcome": "PAUSE", "consent": ["Proposed purpose 'research_ai_training' is not in any recorded consent (recorded purposes: treatment)."], "missed": ["Proposed purpose 'research_ai_training' is not in any recorded consent (recorded purposes: treatment)."], "regs": [{"code": "DHA", "decision": "PERMIT_WITH_CONDITIONS", "verified": 8, "total": 8, "quote": "If it is not practicable to work with anonymous data, then consent is normally required", "doc": "Standards for Health Information Consent and Access Control", "unmet": ["No evidence shows the data is anonymised rather than pseudonymised; it is only 'described as de-identified'.", "No evidence shows that proper controls verified the anonymisation.", "No consent covers research or AI training (the recorded purpose is treatment only). This consent is needed if the data turns out se of Information and Communications Technology (ICT) in Healthcare", "unmet": ["The evidence does not show written consent from the patient that satisfies Article 16. The tracker shows only a 'treatment' consent recorded under DOH, and its form (written or not) and scope are not established.", "No documented reliance on an Article 16 exception is shown as an alternative to written consent.", "There is no evidence that the receiving hospital has committed to confidentiality and health-purpose-only use.", "There is no evidence that the exchange is limited to authorized individuals and to the minimum necessary data."]}]}], "gaps": 1}], "quotes_verified": 122, "quotes_total": 122, "model_name": "Claude Opus 5.5", "run_dates": "10 Nov 2026 (UTC)", "kb_docs": 12, "kb_passages": 797}</script>
<script>
window.__errors = [];
window.addEventListener("error", e => window.__errors.push(String(e.message)));
const D = JSON.parse(document.getElementById("data").textContent);
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.body.classList.add("embed");

function fit() {
  const vp = document.getElementById("vp");
  const k = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  document.getElementById("canvas").style.setProperty("--k", String(k));
}
window.addEventListener("resize", fit); fit();

const NODES = [["req","SRC","Handoff request"],["ct","RULES","Consent tracker"],["DHA","M","DHA agent"],["DOH","M","DoH agent"],
               ["FEDERAL","M","Federal agent"],["qc","P","Quote checker"],["co","P","Coordinator"],["out","D / SINK","Outcome"]];
const LABEL = {PERMIT:"Allowed", PERMIT_WITH_CONDITIONS:"Allowed with conditions", BLOCK:"Blocks it", SILENT:"Rules silent", NOT_APPLICABLE:"Not applicable"};
const CHIP = {PERMIT:"c-green", PERMIT_WITH_CONDITIONS:"c-amber", BLOCK:"c-red", SILENT:"c-violet", NOT_APPLICABLE:"c-gray"};
const SHORT = {DHA:"Dubai Health Authority (DHA)", DOH:"Abu Dhabi Department of Health (DoH)", FEDERAL:"UAE federal law"};
const BRIEF = {DHA:"Dubai (DHA)", DOH:"Abu Dhabi (DoH)", FEDERAL:"Federal law"};
const FULL = "s1_care_transfer";            // the one scenario shown step by step; the others are condensed
const STORY = {
  s1_care_transfer: "A patient moves from an Abu Dhabi hospital to a Dubai hospital and asks for the records to follow.",
  s4_care_transfer_completed: "The same transfer, after the patient signs the consents and the hospitals confirm a signed-referral route.",
  s2_research_reuse: "Error scenario: the Dubai hospital shares a de-identified copy for AI training, then the partner wants to process it outside the UAE.",
  s5_ai_training_completed: "AI training again, this time after the patient opts in, with ethics approval and UAE-only processing.",
  s3_care_transfer_arabic: "The care transfer again, for a patient who writes in Arabic."
};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function add(parent, child, delay) { if (delay !== undefined) { child.classList.add("pop"); child.style.animationDelay = delay + "s"; } parent.appendChild(child); return child; }

function drawPipe(state) {
  const p = document.getElementById("pipe"); p.replaceChildren();
  NODES.forEach(([id, tag, name], i) => {
    if (i) p.appendChild(el("div", "arrow", "→"));
    const n = el("div", "node " + (state[id] || "")); n.appendChild(el("small", "", tag)); n.appendChild(document.createTextNode(name));
    if (state.anim) { n.style.transitionDelay = (i * 0.35) + "s"; }
    p.appendChild(n);
  });
}

const frames = [];
function F(where, caption, pipe, render) { frames.push({where, caption, pipe: pipe || {}, render}); }

// ---------- intro ----------
F("Introduction", "A checkpoint that checks every regulator's rules before a patient's health record leaves a hospital.", {}, s => {
  const t = add(s, el("div", "title"), 0);
  t.appendChild(el("h1", "", "SovereignGuard"));
  t.appendChild(el("h2", "", "Passport control for health records"));
  t.appendChild(el("p", "", "Team Polaris · Asna Khan (team leader) · Shafi Anwar"));
  t.appendChild(el("p", "", "ITU AI for Good Sandbox Hackathon, United Arab Emirates 2026"));
  t.appendChild(el("p", "", `Every scenario result in these slides comes from the saved runs of the real system (${D.model_name}, ${D.run_dates}).`));
  t.appendChild(el("p", "muted", "Research prototype on simulated scenarios. Not legal advice."));
});
F("The problem", "One record, three regulators. Before it moves, someone has to check all three sets of rules.", {}, s => {
  const r = add(s, el("div", "grid3"), 0);
  [["Dubai Health Authority (DHA)","Rules for Dubai facilities"],["Department of Health - Abu Dhabi (DoH)","Rules for Abu Dhabi facilities"],["UAE federal law","Applies everywhere in the UAE"]]
    .forEach(([h, p], i) => { const c = add(r, el("div", "card"), 0.2 + i * 0.3); c.appendChild(el("h3", "", h)); c.appendChild(el("p", "", p + ". Its own rules on consent and sharing.")); });
  const w = add(s, el("div", "card"), 1.3); w.style.marginTop = "calc(3*var(--vh))";
  w.appendChild(el("h3", "", "Three reasons a record leaves a hospital in our scenarios"));
  const row = el("div", ""); ["Continuing treatment in another emirate", "AI training by a research partner", "Processing on a server"].forEach(x => row.appendChild(el("span", "chip c-gray", x)));
  w.appendChild(row);
});
F("Setup", "It runs on an ordinary laptop. AI is used where judgement is needed, fixed rules everywhere else.", {}, s => {
  const r = add(s, el("div", "row"), 0); r.style.alignItems = "stretch";
  const h = add(r, el("div", "card"), 0.1); h.style.flex = "1"; h.appendChild(el("h3", "", "Hardware"));
  const hu = el("ul"); ["Laptop: Apple M1 Pro, 16 GB RAM", "No special hardware"].forEach(x => hu.appendChild(el("li", "", x))); h.appendChild(hu);
  const sw = add(r, el("div", "card"), 0.4); sw.style.flex = "2.2"; sw.appendChild(el("h3", "", "Software"));
  const su = el("ul");
  ["Python 3.12", `Knowledge base: ${D.kb_docs} public UAE documents, ${D.kb_passages} passages, split by regulator (ChromaDB)`,
   `Regulator agents and patient navigator: ${D.model_name}`, "Consent tracker, coordinator and quote checker: fixed rules, no AI",
   "The same 12 documents are also built with the ITU reference code (ITUAIReadiness): 572 passages"].forEach((x, i) => add(su, el("li", "", x), 0.6 + i * 0.2));
  sw.appendChild(su);
});
F("Architecture", "Each regulator agent reads only its own regulator's documents. Labels follow the ITU-T Y.3172 pipeline.",
  {anim: 1, req:"active", ct:"active", DHA:"active", DOH:"active", FEDERAL:"active", qc:"active", co:"active", out:"active"}, s => {
  const c = add(s, el("div", "card"), 0); c.style.maxWidth = "calc(70*var(--vw))"; c.style.margin = "calc(2*var(--vh)) auto 0";
  c.appendChild(el("h3", "", "How a handoff is checked"));
  const ol = el("ol", "list");
  ["The consent tracker compares the request with what the patient agreed to.",
   "Only the regulators involved are asked: the sender's emirate, the receiver's emirate and federal law. Each answers on its own and quotes the clause.",
   "The quote checker matches every quote against the source text.",
   "The coordinator applies fixed rules: any block means BLOCKED; anything missing means ON HOLD with one checklist; otherwise RELEASED."]
   .forEach((x, i) => add(ol, el("li", "", x), 0.5 + i * 0.35));
  c.appendChild(ol);
});

// ---------- scenarios ----------
D.scenarios.forEach((sc) => {
  F(sc.title, STORY[sc.id] || sc.title, {req:"active"}, s => {
    const c = add(s, el("div", "card"), 0); c.style.maxWidth = "calc(70*var(--vw))"; c.style.margin = "calc(4*var(--vh)) auto 0";
    c.appendChild(el("h3", "", sc.title));
    const q = el("p", sc.lang === "ar" ? "rtl" : "", "“" + sc.request + "”"); q.style.fontSize = "calc(2.4*var(--vh))"; c.appendChild(q);
    c.appendChild(el("p", "muted", "Simulated scenario · saved run, no live model call"));
  });
  sc.steps.forEach((st) => {
    if (sc.id === "s3_care_transfer_arabic") return;      // same checks as the first scenario; only the Arabic message differs
    const involved = new Set(st.regs.map(r => r.code));
    const base = {}; ["DHA","DOH","FEDERAL"].forEach(c => { if (!involved.has(c)) base[c] = "skip"; });
    const P = extra => Object.assign({}, base, extra);
    const stepName = sc.steps.length > 1 ? `Step ${st.id} of ${sc.steps.length}: ` : "";
    const outCls = {PAUSE:"hold", PROCEED:"rel", BLOCK:"blk"}[st.outcome];

    function layout(s, upto, popAll) {
      const g = el("div", "split"); s.appendChild(g);
      const L = el("div", "col"), R = el("div", "col"); g.appendChild(L); g.appendChild(R);
      L.appendChild(el("h4", "", "Without SovereignGuard")); R.appendChild(el("h4", "", "With SovereignGuard"));
      const h = el("div", "handoff"); h.appendChild(el("b", "", st.title)); h.appendChild(el("div", "muted", `${st.from} → ${st.to} · purpose: ${st.purpose}`));
      R.appendChild(h);
      if (upto >= 1) {
        const b = add(L, el("div", "banner b-sent", "SENT"), upto === 1 ? 0 : undefined); b.appendChild(el("span", "", "No checks. The record moves at once."));
        if (st.missed.length) { const c = el("div", "card box"); c.appendChild(el("b", "", "Problems nobody checked")); const u = el("ul"); st.missed.forEach(m => u.appendChild(el("li", "", m))); c.appendChild(u); add(L, c, upto === 1 ? 0.3 : undefined); }
      }
      if (upto >= 2) {
        const c = add(R, el("div", "card box"), upto === 2 ? 0 : undefined); c.appendChild(el("b", "", "Consent tracker "));
        if (st.consent.length) st.consent.forEach(x => c.appendChild(el("div", "", x))); else c.appendChild(el("span", "muted", "no consent problem found"));
      }
      if (upto >= 3) {
        const grid = el("div", "regs"); R.appendChild(grid);
        st.regs.forEach((r, i) => {
          if (upto < 3 + i) return;
          const c = add(grid, el("div", "card reg"), popAll ? 0.2 + i * 0.35 : ((upto === 3 + i) ? 0 : undefined));
          c.appendChild(el("h5", "", SHORT[r.code] || r.code));
          c.appendChild(el("span", "chip " + (CHIP[r.decision] || "c-gray"), LABEL[r.decision] || r.decision));
          c.appendChild(el("div", "ok", `✓ ${r.verified}/${r.total} quotes matched`));
          if (r.quote) { c.appendChild(el("div", "q", "“" + r.quote + "”")); c.appendChild(el("div", "src", r.doc)); }
        });
      }
      return R;
    }
    const nR = st.regs.length;
    const sentCap = st.missed.length ? `Without SovereignGuard the record moves at once. ${plural(st.missed.length, "problem", "problems")} nobody checked.` : "Without SovereignGuard the record moves at once, with no checks.";
    const allDone = {req:"done", ct:"done"}; st.regs.forEach(x => allDone[x.code] = "done");
    const allActive = {req:"done", ct:"done", qc:"active"}; st.regs.forEach(x => allActive[x.code] = "active");
    const v = st.regs.reduce((a, r) => a + r.verified, 0), t = st.regs.reduce((a, r) => a + r.total, 0);
    const decs = [...new Set(st.regs.map(r => r.decision))];
    const decCap = decs.length === 1 ? `${st.regs.length === 3 ? "All three" : "Both"}: ${(LABEL[decs[0]] || decs[0]).toLowerCase()}.`
                                     : st.regs.map(r => `${BRIEF[r.code] || r.code}: ${(LABEL[r.decision] || r.decision).toLowerCase()}`).join("; ") + ".";
    const unmet = st.regs.flatMap(r => r.unmet.map(u => [r.code, u]));
    const blockRegs = st.regs.filter(r => r.decision === "BLOCK").map(r => SHORT[r.code] || r.code);
    const blockers = blockRegs.join(" and ");
    const outCap = st.outcome === "PROCEED" ? "RELEASED. Every regulator is satisfied, so the record is released and the handoff is recorded."
      : st.outcome === "BLOCK" ? `BLOCKED. ${blockers} ${blockRegs.length > 1 ? "block" : "blocks"} this step. Nothing is released.`
      : `ON HOLD. ${plural(unmet.length, "item", "items")} still needed. Nothing is released.`;
    const outcomeFrame = cap => F(sc.title, cap, P(Object.assign({}, allDone, {qc:"done", co:"done", out:outCls})), s => {
      const R = layout(s, 3 + nR);
      const cls = {PAUSE:"b-hold", PROCEED:"b-rel", BLOCK:"b-blk"}[st.outcome];
      const word = {PAUSE:"ON HOLD", PROCEED:"RELEASED", BLOCK:"BLOCKED"}[st.outcome];
      const b = el("div", "banner " + cls, word);
      b.appendChild(el("span", "", st.outcome === "PAUSE" ? `${plural(unmet.length, "item", "items")} still needed before release` : (st.outcome === "BLOCK" ? `${blockers} ${blockRegs.length > 1 ? "block" : "blocks"} this step` : "Every regulator is satisfied")));
      R.insertBefore(b, R.children[2]); b.classList.add("pop");
    });

    if (sc.id === FULL) {
      F(sc.title, `${stepName}${st.title}. ${sentCap}`, P({req:"active"}), s => layout(s, 1));
      F(sc.title, st.consent.length ? "The consent tracker compares the request with what the patient agreed to, and flags a problem." : "The consent tracker compares the request with what the patient agreed to.", P({req:"done", ct:"active"}), s => layout(s, 2));
      F(sc.title, `Each regulator checks only its own rules and quotes the clause. ${decCap} The quote checker matched ${v} of ${t} quotes to the source text.`, P(allActive), s => layout(s, 3 + nR, true));
      outcomeFrame(outCap);
      if (st.outcome === "PAUSE" && unmet.length) {
        F(sc.title, "Care Passport: one checklist of what is still missing, for the patient and the hospitals.", P(Object.assign({}, allDone, {qc:"done", co:"done", out:outCls})), s => {
          const c = add(s, el("div", "card"), 0); c.style.maxWidth = "calc(78*var(--vw))"; c.style.margin = "0 auto";
          c.appendChild(el("h3", "", "Care Passport · still needed before release"));
          const u = el("ul", "list"); unmet.forEach(([code, txt], i) => { const li = add(u, el("li", ""), 0.2 + i * 0.25); li.appendChild(el("b", "", "☐ " + code + ": ")); li.appendChild(document.createTextNode(txt)); });
          c.appendChild(u);
        });
      }
    } else if (st.outcome === "BLOCK") {
      F(sc.title, `${stepName}${st.title}. ${sentCap}`, P({req:"active"}), s => layout(s, 1));
      outcomeFrame(`${decCap.replace(/\.$/, "")}. BLOCKED: nothing is released.`);
      if (sc.id === "s2_research_reuse") {
        F(sc.title, "Where our own system went wrong, and why nothing leaked.", P(Object.assign({}, allDone, {qc:"done", co:"done", out:outCls})), s => {
          const c = add(s, el("div", "card"), 0); c.style.maxWidth = "calc(74*var(--vw))"; c.style.margin = "calc(2*var(--vh)) auto 0";
          c.appendChild(el("h3", "", "Error scenario"));
          const u = el("ol", "list lg");
          ["In our first run, both agents said the rules were silent on sending data outside the UAE.",
           "Our own check showed a retrieval miss, not a real silence: Federal Law No. 2 of 2019, Article 13 prohibits it.",
           "Because outcomes are fail-closed, the data was held, not released.",
           "Fix: each agent now runs focused legal-term searches. The federal agent finds Article 13 and blocks the transfer."].forEach((x, i) => add(u, el("li", "", x), 0.3 + i * 0.4));
          c.appendChild(u);
        });
      }
    } else {
      outcomeFrame(`${stepName}${st.title}. ${decCap} ${v} of ${t} quotes matched. ${outCap}`);
      if (sc.id === "s5_ai_training_completed") {
        F(sc.title, "Same request, different answers: federal law is satisfied, Dubai's rules still need more evidence.", P(Object.assign({}, allDone, {qc:"done", co:"done", out:outCls})), s => {
          const r = add(s, el("div", "row"), 0); r.style.marginTop = "calc(3*var(--vh))";
          st.regs.forEach((x, i) => { const c = add(r, el("div", "card"), 0.2 + i * 0.4); c.style.flex = "1"; c.appendChild(el("h3", "", SHORT[x.code] || x.code));
            c.appendChild(el("div", "big", String(x.unmet.length))); c.appendChild(el("p", "", x.unmet.length === 1 ? "item still missing" : "items still missing")); });
        });
      }
    }
  });
  if (sc.id === FULL || sc.lang === "ar") {
    const p = sc.plan;
    F(sc.title, sc.lang === "ar" ? "The patient wrote in Arabic and gets the checklist in Arabic." : "The patient gets plain-language next steps.", {}, s => {
      const c = add(s, el("div", "card" + (sc.lang === "ar" ? " rtl" : "")), 0); c.style.maxWidth = "calc(74*var(--vw))"; c.style.margin = "0 auto";
      c.appendChild(el("h3", "", p.headline)); c.appendChild(el("p", "", p.status_in_plain_words));
      const u = el("ol", "list"); p.what_you_need_to_do.forEach((x, i) => add(u, el("li", "", x), 0.3 + i * 0.25)); c.appendChild(u);
      c.appendChild(el("p", "muted", p.disclaimer));
    });
  }
});

// ---------- outro ----------
const outs = {PAUSE:0, PROCEED:0, BLOCK:0}; D.scenarios.forEach(sc => sc.steps.forEach(st => outs[st.outcome]++));
F("Results", "Every quote the agents used was checked against the regulation text.", {}, s => {
  const r = add(s, el("div", "grid3"), 0); r.style.marginTop = "calc(4*var(--vh))";
  [[String(D.scenarios.length), "simulated scenarios, each run with and without SovereignGuard"],
   [`${D.quotes_verified}/${D.quotes_total}`, "quoted clauses matched to the source text"],
   [`${outs.PROCEED} · ${outs.PAUSE} · ${outs.BLOCK}`, "handoffs released · held · blocked"]]
   .forEach(([b, t], i) => { const c = add(r, el("div", "card"), 0.2 + i * 0.35); c.style.textAlign = "center"; c.appendChild(el("div", "big", b)); c.appendChild(el("p", "", t)); });
});
F("Gaps and next steps", "Gaps for policy makers, and what comes next.", {}, s => {
  const r = add(s, el("div", "row"), 0); r.style.alignItems = "stretch";
  const g = add(r, el("div", "card"), 0.1); g.style.flex = "1"; g.appendChild(el("h3", "", "Policy gaps found"));
  const gu = el("ul", "list"); ["No rule for recognising consent across emirate frameworks", "Different wording for \"de-identified\"", "AI model training is not named as a purpose"].forEach((x, i) => add(gu, el("li", "", x), 0.3 + i * 0.25)); g.appendChild(gu);
  const n = add(r, el("div", "card"), 0.5); n.style.flex = "1"; n.appendChild(el("h3", "", "Next steps"));
  const src = add(s, el("p", "muted", "Policy gaps and next steps: from our technical report, sections 7.2 and 8."), 0.9); src.style.fontSize = "calc(1.8*var(--vh))"; src.style.textAlign = "center";
  const nu = el("ul", "list"); ["Legal expert review of the agents' outputs", "Add the missing federal texts and official Arabic versions", "Offline local-model option, so it runs without an API key", "Reuse in a second domain by swapping the regulators' documents", "Y.3172 extension proposal and a paper"].forEach((x, i) => add(nu, el("li", "", x), 0.7 + i * 0.2)); n.appendChild(nu);
});

// ---------- player ----------
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[cur];
  document.getElementById("where").textContent = `${f.where} · ${cur + 1} / ${frames.length}`;
  document.getElementById("captext").textContent = f.caption;
  drawPipe({});
  const st = document.getElementById("stage"); st.replaceChildren(); f.render(st);
  requestAnimationFrame(() => requestAnimationFrame(() => drawPipe(f.pipe)));
  if (window.parent !== window) window.parent.postMessage({sg: "pos", i: cur, n: frames.length}, "*");   // slide number only
}
window.__go = show; window.__n = () => frames.length;
// The product page may send only these two commands; anything else is ignored.
window.addEventListener("message", e => {
  if (e.source !== window.parent || !e.data || typeof e.data !== "object") return;
  if (e.data.sg === "go" && Number.isInteger(e.data.i)) show(e.data.i);
  if (e.data.sg === "step" && (e.data.d === 1 || e.data.d === -1)) show(cur + e.data.d);
});
document.addEventListener("keydown", e => {
  if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(frames.length - 1);
});
document.getElementById("back").addEventListener("click", e => e.stopPropagation());
document.getElementById("canvas").addEventListener("click", () => show(cur + 1));
show(0);
</script>
</body>
